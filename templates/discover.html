<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='discover.css') }}">
    <title>Dashboard</title>
</head>
    <body>

        <div class="horizontal-bar">
            <a href="{{ url_for('settings') }}">
                <img src="{{ url_for('static', filename='icons/setting.png') }}" alt="" class="horizontal-icons">
            </a>
            <a href="{{ url_for('logout') }}">
                <img src="{{ url_for('static', filename='icons/logout.png') }}" alt="" class="horizontal-icons">
            </a>
        </div>

        <nav class="vertical-bar">
            <a href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='icons/home.png') }}" alt="" class="nav-icon">
                Home
            </a>
            
            <a href="{{ url_for('dashboard') }}">
                <img src="{{ url_for('static', filename='icons/dashboard.png') }}" alt="" class="nav-icon">
                Dashboard
            </a>
            
            <a href="{{ url_for('discover') }}">
                <img src="{{ url_for('static', filename='icons/loupe.png') }}" alt="" class="nav-icon">
                Discover
            </a>
        </nav>
        <main>
            <input type="text" id="query" placeholder="Enter a search">
            <button id="submit-search">Search</button>
            <div class="log-viewer-window">
                <pre id="log-output" class="logviewer"></pre>
            </div>
            
            <button id="refresh">Refresh</button>
        </main>
        
        <script src="{{ url_for('static', filename='js/discover.js') }}"></script>
    </body>
</html>
