<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='setting-pages-css/notifications-settings.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='profile-menu.css') }}">
    <title>AegisWatch | Settings</title>
</head>
    <body>
        <div class="top-bar">
            <div class="website-brand">
                <img src="{{ url_for('static', filename='icons/brand-shield.svg') }}" alt="AegisWatch radar mark" width="32" height="32" id="sentinel-siem-icon">
                <span id="website-name">AegisWatch</span>
            </div>
            <div class="environment">
                <span class="status-dot"></span>
                <select aria-label="Environment">
                    <option>Production</option>
                    <option>Development</option>
                </select>
            </div>
            <div class="operational-status">
                <span class="operation">All systems operational</span>
            </div>
            <div class="search-area">
                <img src="{{ url_for('static', filename='icons/search.svg') }}" alt="Search" width="25" height="25" id="search-icon">
                <input class="search-bar" placeholder="Search logs, alerts, hosts, users...">
            </div>
            {% include 'profile-menu.html' %}
        </div>

        <div class="page-layout">
            <nav class="side-bar">
                <a href="{{ url_for('pages.overview_page') }}"
                    {% if request.endpoint == 'overview' %}aria-current="page"{% endif %}>
                    <img src="{{ url_for('static', filename='icons/overview.svg') }}" alt="">
                    <span>Overview</span>
                </a>
                <a href="{{ url_for('pages.incidents_page') }}"
                    {% if request.endpoint == 'pages.incidents_page' %}aria-current="page"{% endif %}>
                    <img src="{{ url_for('static', filename='icons/incidents.svg') }}" alt="">
                    <span>Incidents</span>
                </a>
                <a href="{{ url_for('pages.alerts_page') }}"
                    {% if request.endpoint == 'pages.alerts_page' %}aria-current="page"{% endif %}>
                    <img src="{{ url_for('static', filename='icons/alerts.svg') }}" alt="">
                    <span>Alerts</span>
                </a>
                <a href="{{ url_for('pages.search_page') }}"
                    {% if request.endpoint == 'pages.search_page' %}aria-current="page"{% endif %}>
                    <img src="{{ url_for('static', filename='icons/search.svg') }}" alt="">
                    <span>Search</span>
                </a>
                <a href="{{ url_for('pages.assets_page') }}"
                    {% if request.endpoint == 'pages.assets_page' %}aria-current="page"{% endif %}>
                    <img src="{{ url_for('static', filename='icons/assets.svg') }}" alt="">
                    <span>Assets</span>
                </a>
                <a href="{{ url_for('pages.investigations_page') }}"
                    {% if request.endpoint == 'pages.investigations_page' %}aria-current="page"{% endif %}>
                    <img src="{{ url_for('static', filename='icons/investigations.svg') }}" alt="">
                    <span>Investigations</span>
                </a>
                <a href="{{ url_for('pages.reports_page') }}"
                    {% if request.endpoint == 'pages.reports_page' %}aria-current="page"{% endif %}>
                    <img src="{{ url_for('static', filename='icons/reports.svg') }}" alt="">
                    <span>Reports</span>
                </a>
                <a href="{{ url_for('pages.settings_page') }}"
                    {% if request.endpoint in ['pages.settings_page', 'pages.general_settings', 'pages.security_settings', 'pages.notifications_settings', 'pages.data_sources_settings', 'pages.administration_settings'] %}aria-current="page"{% endif %}>
                    <img src="{{ url_for('static', filename='icons/settings.svg') }}" alt="">
                    <span>Settings</span>
                </a>
            </nav>

            <main>
                <div class="settings-nav">
                    <a href="{{ url_for('pages.general_settings') }}"
                        {% if request.endpoint == 'pages.general_settings' %}aria-current="page"{% endif %}>
                        <img src="{{ url_for('static', filename='icons/settings.svg') }}" alt="" width="20px", height="20px">
                        <span>General</span>
                    </a>
                    <a href="{{ url_for('pages.security_settings') }}"
                        {% if request.endpoint == 'pages.security_settings' %}aria-current="page"{% endif %}>
                        <img src="{{ url_for('static', filename='icons/security.svg') }}" alt="" width="20px", height="20px">
                        <span>Security</span>
                    </a>
                    <a href="{{ url_for('pages.notifications_settings') }}"
                        {% if request.endpoint == 'pages.notifications_settings' %}aria-current="page"{% endif %}>
                        <img src="{{ url_for('static', filename='icons/notifications.svg') }}" alt="" width="20px", height="20px">
                        <span>Notifications</span>
                    </a>
                    <a href="{{ url_for('pages.data_sources_settings') }}"
                        {% if request.endpoint == 'pages.data_sources_settings' %}aria-current="page"{% endif %}>
                        <img src="{{ url_for('static', filename='icons/data-sources.svg') }}" alt="" width="20px", height="20px">
                        <span>Data Sources</span>
                    </a>
                    <a href="{{ url_for('pages.administration_settings') }}"
                        {% if request.endpoint == 'pages.administration_settings' %}aria-current="page"{% endif %}>
                        <img src="{{ url_for('static', filename='icons/administration.svg') }}" alt="" width="20px", height="20px">
                        <span>Administration</span>
                    </a>
                </div>
                <div class="settings-page">

                </div>
            </main>
        </div>
        <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
    </body>
</html>
